<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources - AIML Learning Platform</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <h2>AIML Learn</h2>
            </div>
            <ul class="nav-menu">
                <li><a href="/" class="nav-link">Home</a></li>
                <li><a href="/resources" class="nav-link active">Resources</a></li>
                <li><a href="/learn" class="nav-link">Learn</a></li>
                <li><a href="/profile" class="nav-link">Profile</a></li>
            </ul>
            <div class="auth-buttons">
                <button id="loginBtn" class="btn btn-secondary">Login</button>
                <button id="signupBtn" class="btn btn-primary">Sign Up</button>
                <button id="logoutBtn" class="btn btn-secondary" style="display:none;">Logout</button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <section class="page-header">
            <h1>Learning Resources</h1>
            <p>Browse our comprehensive collection of AI/ML learning materials</p>
        </section>

        <section class="filters">
            <div class="filter-group">
                <label>Category:</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Neural Networks">Neural Networks</option>
                    <option value="Machine Learning">Machine Learning</option>
                    <option value="Deep Learning">Deep Learning</option>
                    <option value="NLP">Natural Language Processing</option>
                    <option value="Computer Vision">Computer Vision</option>
                    <option value="Reinforcement Learning">Reinforcement Learning</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Difficulty:</label>
                <select id="difficultyFilter">
                    <option value="">All Levels</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>
        </section>

        <section class="resources-container">
            <div id="resourcesList" class="resources-grid">
                <div class="loading">Loading resources...</div>
            </div>
        </section>
    </main>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/resources.js"></script>
</body>
</html>
